<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:linear-gradient(180deg,#0a0a0a,#151515);
    min-height:100vh;
    color:#fff;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:500px;
    padding:20px;
}

.banner{
    width:100%;
    height:190px;
    border-radius:25px;
    overflow:hidden;
    margin-bottom:30px;
    box-shadow:0 0 35px rgba(255,255,255,0.08);
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.promo{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:25px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    margin-bottom:30px;
    transition:0.3s;
}

.promo:hover{
    transform:translateY(-3px);
}

.promo-title{
    color:#bcbcbc;
    margin-bottom:15px;
    font-size:15px;
}

.promo-code{
    font-size:34px;
    font-weight:700;
    color:#00ff88;
    letter-spacing:3px;
}

.copy-text{
    color:#8d8d8d;
    margin-top:12px;
    font-size:14px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.link-btn{
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#6b2dff,#a855f7);
    border-radius:22px;
    padding:20px;
    text-align:center;
    font-size:18px;
    font-weight:600;
    box-shadow:0 10px 35px rgba(128,0,255,0.35);
    transition:0.3s;
}

.link-btn:hover{
    transform:translateY(-5px);
}

.language-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.language-box{
    width:90%;
    max-width:400px;
    background:#171717;
    border-radius:25px;
    padding:35px;
    text-align:center;
}

.language-box h2{
    margin-bottom:25px;
}

.lang-btn{
    width:100%;
    border:none;
    background:#242424;
    color:white;
    padding:18px;
    margin:10px 0;
    border-radius:18px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.lang-btn:hover{
    background:#333;
}

@media(max-width:600px){

    .banner{
        height:150px;
    }

    .promo-code{
        font-size:28px;
    }

    .link-btn{
        font-size:17px;
        padding:18px;
    }
}
</style>

</head>
<body>

<div id="languageModal" class="language-modal">
    <div class="language-box">

        <h2>🌐 Select Language</h2>

        <button class="lang-btn" onclick="setLanguage('ru')">
            🇷🇺 Русский
        </button>

        <button class="lang-btn" onclick="setLanguage('en')">
            🇬🇧 English
        </button>

        <button class="lang-btn" onclick="setLanguage('hi')">
            🇮🇳 हिन्दी
        </button>

    </div>
</div>

<div class="container">

    <div class="banner">
        <img src="banner.png" alt="Banner">
    </div>

    <div class="promo" onclick="copyPromo()">

        <div id="promoTitle" class="promo-title">
            Промокод (нажми, чтобы скопировать)
        </div>

        <div id="promoCode" class="promo-code">
            HD6DG
        </div>

        <div id="copyText" class="copy-text">
            Нажмите для копирования
        </div>

    </div>

    <div class="links">

        <a
            id="btn1"
            href="https://one-vv53243.com/?open=register&p=9ftx"
            class="link-btn"
            target="_blank">
            🎁 MINE SLOT
        </a>

        <a
            id="btn2"
            href="https://one-vv53243.com/?open=register&p=9ftx"
            class="link-btn"
            target="_blank">
            🔥 AVIAMASTER
        </a>

        <a
            id="btn3"
            href="https://one-vv53243.com/?open=register&p=9ftx"
            class="link-btn"
            target="_blank">
            💎 TOWER RUSH
        </a>

    </div>

</div>

<script> let currentLang = "ru"; const texts = { ru:{ promoTitle:"Промокод (нажми, чтобы скопировать)", promoCopy:"Нажмите для копирования", copied:"✅ Промокод скопирован!", btn1:"MINE SLOT", btn2:"AVIAMASTER", btn3:"TOWER RUSH" }, en:{ promoTitle:"Promo code (tap to copy)", promoCopy:"Tap to copy", copied:"✅ Promo code copied!", btn1:"MINE SLOT", btn2:"AVIAMASTER", btn3:"TOWER RUSH" }, hi:{ promoTitle:"प्रोमो कोड (कॉपी करने के लिए दबाएँ)", promoCopy:"कॉपी करने के लिए दबाएँ", copied:"✅ प्रोमो कोड कॉपी हो गया!", btn1:"MINE SLOT", btn2:"AVIAMASTER", btn3:"TOWER RUSH" } }; function setLanguage(lang){ currentLang = lang; document.getElementById("promoTitle").innerText = texts[lang].promoTitle; document.getElementById("copyText").innerText = texts[lang].promoCopy; document.getElementById("btn1").innerText = texts[lang].btn1; document.getElementById("btn2").innerText = texts[lang].btn2; document.getElementById("btn3").innerText = texts[lang].btn3; document.getElementById("languageModal").style.display = "none"; } function copyPromo(){ const code = document.getElementById("promoCode").innerText; navigator.clipboard.writeText(code); document.getElementById("copyText").innerText = texts[currentLang].copied; } </script>

</body>
</html>
